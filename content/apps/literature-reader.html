<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>光伏文献 · 每日抽读</title>
<style>
*{box-sizing:border-box}
:root{--bg:#fbfbfa;--ink:#18181b;--muted:#71717a;--line:#e4e4e7;--acc:#2563eb;--ok:#0f766e;--no:#a1a1aa;--warn:#b45309}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif}
header{padding:28px 32px 0;max-width:1180px;margin:0 auto}
h1{font-size:19px;margin:0 0 4px;letter-spacing:.2px}
.sub{color:var(--muted);font-size:13px}
.wrap{max-width:1180px;margin:0 auto;padding:20px 32px 80px;display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:28px;align-items:start}
@media(max-width:900px){.wrap{grid-template-columns:1fr;padding:16px}}
.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:14px 0 20px}
button{font:inherit;font-size:13px;cursor:pointer;border:1px solid var(--line);background:#fff;color:var(--ink);padding:7px 14px;border-radius:99px;transition:.15s}
button:hover{border-color:#c4c4c8}
button.primary{background:var(--ink);color:#fff;border-color:var(--ink)}
button.primary:hover{opacity:.86}
button.small{padding:4px 11px;font-size:12px}
button:disabled{opacity:.4;cursor:default}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:12px;transition:.15s}
.card.want{border-color:#bfdbfe;box-shadow:0 1px 0 #eff6ff}
.card.no{opacity:.42}
.card.read{border-color:#99f6e4;background:#f6fffd}
.meta{display:flex;gap:9px;align-items:center;font-size:12px;color:var(--muted);flex-wrap:wrap}
.idx{font-variant-numeric:tabular-nums;font-weight:600;color:#a1a1aa}
.pill{border:1px solid var(--line);border-radius:99px;padding:0 8px;font-size:11px;line-height:18px}
.pill.t-形貌{background:#f5f3ff;border-color:#ddd6fe;color:#5b21b6}
.pill.t-放大{background:#fff7ed;border-color:#fed7aa;color:#9a3412}
.pill.t-钙钛矿代表作{background:#fef2f2;border-color:#fecaca;color:#991b1b}
.cite{font-variant-numeric:tabular-nums}
h3{font-size:15.5px;line-height:1.45;margin:8px 0 4px;font-weight:600}
.venue{font-size:13px;color:var(--muted);font-style:italic}
.acts{display:flex;gap:8px;align-items:center;margin-top:12px;flex-wrap:wrap}
.acts .sp{flex:1}
.btn-want.on{background:#eff6ff;border-color:#93c5fd;color:#1d4ed8}
.btn-no.on{background:#f4f4f5;border-color:#d4d4d8;color:#52525b}
.btn-read.on{background:#ccfbf1;border-color:#5eead4;color:#0f766e}
a.doi{font-size:12.5px;color:var(--acc);text-decoration:none;border-bottom:1px solid #bfdbfe;padding-bottom:1px}
a.doi:hover{border-color:var(--acc)}
.hint{font-size:12.5px;color:var(--muted)}
aside{position:sticky;top:20px}
.panel{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:14px}
.panel h2{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0 0 12px;font-weight:600}
.stat{display:flex;justify-content:space-between;font-size:13px;padding:5px 0;border-bottom:1px dashed var(--line)}
.stat:last-child{border:0}
.stat b{font-variant-numeric:tabular-nums}
.track{height:5px;background:var(--line);border-radius:99px;overflow:hidden;margin:10px 0 4px}
.track i{display:block;height:100%;background:var(--acc);width:0;transition:.3s}
#purified,#starred{max-height:34vh;overflow:auto;margin:0 -4px}
.pi a{color:inherit;text-decoration:none}
.pi a:hover{color:var(--acc)}
.btn-star.on{background:#fffbeb;border-color:#fcd34d;color:#b45309}
.unstar{color:#a1a1aa;text-decoration:none;font-size:11px;padding:0 3px;cursor:pointer}
.unstar:hover{color:#dc2626}
.pi{font-size:13px;padding:7px 4px;border-bottom:1px solid #f4f4f5;line-height:1.45}
.pi:last-child{border:0}
.pi .yr{color:var(--muted);font-size:11.5px}
.grp{font-size:11.5px;color:var(--muted);margin:12px 0 4px;letter-spacing:.04em}
.empty{font-size:12.5px;color:var(--muted);padding:6px 0}
footer{max-width:1180px;margin:0 auto;padding:0 32px 40px;color:var(--muted);font-size:12px}
</style>
</head>
<body>
<header>
  <h1>光伏文献 · 每日抽读</h1>
  <div class="sub">126 篇 · 三人组内直属产出 · 点「想读」才出现 DOI · 读完打勾进「已读完」 · 值得回看的点 ☆ 进第二个盒子</div>
  <div class="sub" id="warn" style="display:none;color:#b45309;margin-top:8px"></div>
</header>

<div class="wrap">
  <main>
    <div class="bar">
      <button class="primary" id="draw">抽今天的十篇</button>
      <button id="redraw">重抽今天</button>
      <span class="hint" id="dayinfo"></span>
    </div>
    <div id="cards"></div>
  </main>

  <aside>
    <div class="panel">
      <h2>今日进度</h2>
      <div class="stat"><span>已判定</span><b id="s-judged">0 / 10</b></div>
      <div class="stat"><span>想读</span><b id="s-want">0</b></div>
      <div class="stat"><span>已读完</span><b id="s-read">0</b></div>
      <div class="stat"><span>累计已读 / 全部</span><b id="s-total">0 / 126</b></div>
      <div class="track"><i id="track"></i></div>
      <div class="hint" id="left"></div>
    </div>

    <div class="panel">
      <h2 id="h-read">✓ 已读完</h2>
      <div id="purified"></div>
      <div class="bar" style="margin:14px 0 0">
        <button class="small" id="exp-md">导出 Markdown</button>
        <button class="small" id="exp-copy">复制</button>
      </div>
      <div class="bar" style="margin:8px 0 0">
        <button class="small" id="exp-csv">导出 CSV</button>
      </div>
    </div>

    <div class="panel">
      <h2 id="h-star">★ 值得回看</h2>
      <div id="starred"></div>
      <div class="bar" style="margin:14px 0 0">
        <button class="small" id="exp-star-md">导出 Markdown</button>
        <button class="small" id="exp-star-csv">导出 CSV</button>
      </div>
      <div class="bar" style="margin:8px 0 0">
        <button class="small" id="reset">清空全部记录</button>
      </div>
    </div>
  </aside>
</div>

<footer>数据来源：OpenAlex（作者身份经 ORCID 锚定）· 记录保存在本浏览器 localStorage</footer>

const KEY = 'pv_reader_v1';
const N = 10;

let S = load();
function load(){
  try{
    const raw = localStorage.getItem(KEY);
    if(raw){ const o = JSON.parse(raw); if(o && o.status){ if(!o.star) o.star = {}; return o; } }
  }catch(e){}
  return { status:{}, star:{}, seen:[], date:null, ids:[] };
}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }

function todayStr(){
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}
const byId = {};
PAPERS.forEach(p => byId[p.i] = p);

// Sanitize records against the current paper list (drop ids that no longer exist,
// keep every still-valid read/star/seen/ids entry intact).
['ids', 'seen'].forEach(k => { if (S[k]) S[k] = S[k].filter(id => byId[id]); });
Object.keys(S.status).forEach(id => { if (!byId[id]) delete S.status[id]; });
Object.keys(S.star).forEach(id => { if (!byId[id]) delete S.star[id]; });

function shuffle(a){
  for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); const t=a[i]; a[i]=a[j]; a[j]=t; }
  return a;
}

function draw(force){
  const t = todayStr();
  if(!force && S.date === t && S.ids.length){ render(); return; }
  let pool = PAPERS.filter(p => S.seen.indexOf(p.i) === -1);
  if(pool.length < N){ S.seen = []; pool = PAPERS.slice(); }
  shuffle(pool);
  const pick = pool.slice(0, N);
  S.ids = pick.map(p => p.i);
  S.date = t;
  pick.forEach(p => { if(S.seen.indexOf(p.i) === -1) S.seen.push(p.i); });
  save(); render();
}

function setStatus(id, st){
  if(S.status[id] === st){ delete S.status[id]; }
  else { S.status[id] = st; }
  save(); render();
}

function toggleStar(id){
  if(S.star[id]){ delete S.star[id]; } else { S.star[id] = 1; }
  save(); render();
}

function esc(s){
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function doiUrl(d){ return 'https://doi.org/' + d; }
function pillCls(t){ return t === '形貌' ? 't-形貌' : (t === '放大/稳定性' ? 't-放大' : (t === '钙钛矿代表作' ? 't-钙钛矿代表作' : '')); }

function cardHTML(p, n){
  const st = S.status[p.i] || '';
  const cls = 'card' + (st === 'want' ? ' want' : st === 'no' ? ' no' : st === 'read' ? ' read' : '');
  let acts = '';
  acts += '<button class="small btn-want' + (st === 'want' ? ' on' : '') + '" data-c="want" data-id="' + p.i + '">想读</button>';
  acts += '<button class="small btn-no' + (st === 'no' ? ' on' : '') + '" data-c="no" data-id="' + p.i + '">不读</button>';
  acts += '<span class="sp"></span>';
  if(st === 'want' || st === 'read'){
    acts += '<a class="doi" href="' + doiUrl(p.d) + '" target="_blank" rel="noopener">DOI ↗</a>';
    acts += '<button class="small btn-read' + (st === 'read' ? ' on' : '') + '" data-c="read" data-id="' + p.i + '">' + (st === 'read' ? '✓ 已读完' : '标记已读完') + '</button>';
    acts += '<button class="small btn-star' + (S.star[p.i] ? ' on' : '') + '" data-c="star" data-id="' + p.i + '">' + (S.star[p.i] ? '★ 回看' : '☆ 回看') + '</button>';
  } else if(st === 'no'){
    acts += '<span class="hint">已剔除</span>';
  } else {
    acts += '<span class="hint">先判定</span>';
  }
  return '<div class="' + cls + '" data-id="' + p.i + '">'
    + '<div class="meta"><span class="idx">' + String(n).padStart(2,'0') + '</span>'
    + '<span>' + p.y + '</span><span>' + esc(p.r) + '</span>'
    + '<span class="pill ' + pillCls(p.t) + '">' + esc(p.t) + '</span>'
    + '<span class="cite">c' + p.c + '</span></div>'
    + '<h3>' + esc(p.ti) + '</h3>'
    + '<div class="venue">' + esc(p.v) + '</div>'
    + '<div class="acts">' + acts + '</div>'
    + '</div>';
}

function readList(){
  return PAPERS.filter(p => S.status[p.i] === 'read')
    .sort((a,b) => a.sn === b.sn ? (b.y - a.y || b.c - a.c) : a.sn.localeCompare(b.sn));
}
function wantList(){
  return PAPERS.filter(p => S.status[p.i] === 'want').sort((a,b) => a.sn.localeCompare(b.sn) || b.y - a.y);
}
function starList(){
  return PAPERS.filter(p => S.star[p.i])
    .sort((a,b) => a.sn === b.sn ? (b.y - a.y || b.c - a.c) : a.sn.localeCompare(b.sn));
}

function render(){
  const box = document.getElementById('cards');
  if(!S.ids.length || S.date !== todayStr()){
    box.innerHTML = '<div class="card"><div class="hint">还没抽取。点上面「抽今天的十篇」，今天固定这一组，不会重复到已经抽过的文章。</div></div>';
    document.getElementById('dayinfo').textContent = '';
  } else {
    box.innerHTML = S.ids.map((id, k) => cardHTML(byId[id], k + 1)).join('');
    document.getElementById('dayinfo').textContent = '今天 ' + S.date + ' 的十篇已锁定';
  }

  const ids = S.date === todayStr() ? S.ids : [];
  const judged = ids.filter(id => S.status[id]).length;
  const want = ids.filter(id => S.status[id] === 'want' || S.status[id] === 'read').length;
  const read = ids.filter(id => S.status[id] === 'read').length;
  const totalRead = PAPERS.filter(p => S.status[p.i] === 'read').length;

  document.getElementById('s-judged').textContent = judged + ' / ' + ids.length;
  document.getElementById('s-want').textContent = want;
  document.getElementById('s-read').textContent = read;
  document.getElementById('s-total').textContent = totalRead + ' / ' + PAPERS.length;
  document.getElementById('track').style.width = (totalRead / PAPERS.length * 100).toFixed(1) + '%';
  const remaining = PAPERS.length - S.seen.length;
  document.getElementById('left').textContent = '本轮未抽过的剩余 ' + remaining + ' 篇';

  const rl = readList(), wl = wantList();
  document.getElementById('h-read').textContent = '✓ 已读完 · ' + rl.length;
  let html = '';
  if(!rl.length && !wl.length){
    html = '<div class="empty">还没有读完的文章。</div>';
  } else {
    if(rl.length){
      let cur = '';
      rl.forEach(p => {
        if(p.sn !== cur){ cur = p.sn; html += '<div class="grp">' + esc(cur) + '</div>'; }
        html += '<div class="pi"><span class="yr">' + p.y + ' · c' + p.c + '</span><br><a href="' + doiUrl(p.d) + '" target="_blank" rel="noopener">' + esc(p.ti) + '</a></div>';
      });
    }
    if(wl.length){
      html += '<div class="grp" style="margin-top:14px">想读·未完成（' + wl.length + '）</div>';
      wl.forEach(p => {
        html += '<div class="pi"><span class="yr">' + p.y + ' · ' + esc(p.sn.split(' ')[1] || p.sn) + '</span><br><a href="' + doiUrl(p.d) + '" target="_blank" rel="noopener">' + esc(p.ti) + '</a></div>';
      });
    }
  }
  document.getElementById('purified').innerHTML = html;

  const sl = starList();
  document.getElementById('h-star').textContent = '★ 值得回看 · ' + sl.length;
  let sh = '';
  if(!sl.length){
    sh = '<div class="empty">还没有标记。读到值得反复看的，点卡片上的 ☆ 回看。</div>';
  } else {
    let cur2 = '';
    sl.forEach(p => {
      if(p.sn !== cur2){ cur2 = p.sn; sh += '<div class="grp">' + esc(cur2) + '</div>'; }
      const unread = S.status[p.i] === 'read' ? '' : ' · 未读完';
      sh += '<div class="pi">'
        + '<span class="yr">' + p.y + ' · c' + p.c + unread + '</span>'
        + '<a class="unstar" data-unstar="' + p.i + '" title="移出回看">✕</a><br>'
        + '<a href="' + doiUrl(p.d) + '" target="_blank" rel="noopener">' + esc(p.ti) + '</a>'
        + '</div>';
    });
  }
  document.getElementById('starred').innerHTML = sh;
}

function listMd(list, title, note){
  const L = [];
  L.push('# ' + title);
  L.push('');
  L.push('更新：' + todayStr() + ' · ' + note);
  L.push('');
  let cur = '';
  list.forEach((p, k) => {
    if(p.sn !== cur){ cur = p.sn; L.push(''); L.push('## ' + cur); L.push(''); }
    L.push((k + 1) + '. ' + p.y + ' · ' + p.r + ' · ' + p.t + ' · c' + p.c + ' · ' + p.ti + ' · ' + p.v + ' · https://doi.org/' + p.d);
  });
  L.push('');
  return L.join('\n');
}

function listCsv(list){
  const q = s => '"' + String(s).replace(/"/g, '""') + '"';
  const rows = [['Scholar','Year','Role','Topic','Cited','Title','Venue','DOI'].join(',')];
  list.forEach(p => rows.push([p.sn, p.y, p.r, p.t, p.c, p.ti, p.v, p.d].map(q).join(',')));
  return rows.join('\n');
}

function mdText(){ return listMd(readList(), '光伏文献 · 已读完', '已读完 ' + readList().length + ' 篇'); }
function csvText(){ return listCsv(readList()); }
function starMdText(){ return listMd(starList(), '光伏文献 · 值得回看', '标记 ' + starList().length + ' 篇'); }
function starCsvText(){ return listCsv(starList()); }

function download(name, text, type){
  const blob = new Blob(['\ufeff' + text], {type: type || 'text/plain;charset=utf-8'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = name;
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
}

document.getElementById('cards').addEventListener('click', e => {
  const b = e.target.closest('button[data-c]');
  if(!b) return;
  if(b.dataset.c === 'star'){ toggleStar(b.dataset.id); }
  else { setStatus(b.dataset.id, b.dataset.c); }
});
document.getElementById('draw').onclick = () => draw(false);
document.getElementById('redraw').onclick = () => { if(confirm('重抽今天这十篇？（之前的记录保留）')) draw(true); };
document.getElementById('exp-md').onclick = () => download('pv_read_list.md', mdText());
document.getElementById('exp-csv').onclick = () => download('pv_read_list.csv', csvText(), 'text/csv;charset=utf-8');
document.getElementById('exp-star-md').onclick = () => download('pv_revisit_list.md', starMdText());
document.getElementById('exp-star-csv').onclick = () => download('pv_revisit_list.csv', starCsvText(), 'text/csv;charset=utf-8');
document.getElementById('starred').addEventListener('click', e => {
  const u = e.target.closest('[data-unstar]');
  if(u){ e.preventDefault(); toggleStar(u.dataset.unstar); }
});
document.getElementById('exp-copy').onclick = async () => {
  try{ await navigator.clipboard.writeText(mdText()); alert('已复制到剪贴板'); }
  catch(e){ alert('复制失败，请用导出 Markdown'); }
};
document.getElementById('reset').onclick = () => {
  if(confirm('清空所有判定、已读记录、回看标记和抽取历史？不可撤销。')){
    S = { status:{}, star:{}, seen:[], date:null, ids:[] };
    save(); render();
  }
};

function storageOK(){
  try{ localStorage.setItem('__t','1'); localStorage.removeItem('__t'); return true; }
  catch(e){ return false; }
}
if(!storageOK()){
  var wEl = document.getElementById('warn');
  if(wEl){ wEl.style.display = 'block'; wEl.textContent = '\u26a0 这个浏览器禁用了本地存储，进度不会被保存 —— 改用 Chrome / Edge 打开本文件。'; }
}

if(S.date === todayStr() && S.ids.length) render();
else { S.ids = []; render(); }
</script>
