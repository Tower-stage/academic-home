<h1>Backroom</h1>
<form id="backroom-gate" class="backroom-gate">
  <div class="gate-field">
    <input id="backroom-pass" type="password" autocomplete="current-password" autofocus
           enterkeyhint="go" aria-label="Password">
    <button type="submit" aria-label="Unlock">🐱</button>
  </div>
</form>
<div id="backroom-content" class="backroom-content" hidden></div>
