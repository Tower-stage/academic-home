{{#if posts}}
<section class="notes">
  <ul class="post-index" id="post-index">
{{#each posts}}
    <li><a href="#post-{{ slug }}" data-post="{{ slug }}">{{ title }}</a>{{#if date}}<span class="post-index-date">{{ date }}</span>{{/if}}</li>
{{/each}}
  </ul>

  <div id="post-view" hidden>
{{#each posts}}
    <article class="post" data-slug="{{ slug }}" hidden>
      <a class="post-back" href="#" data-back="1">← 全部文章</a>
      <h2>{{ title }}</h2>
{{#if date}}      <p class="post-date">{{ date }}</p>
{{/if}}      <div class="post-body">{{ body }}</div>
    </article>
{{/each}}
  </div>
</section>
{{else}}
<p class="section-empty">还没有文章。在 <code>content/backroom/</code> 里新建一个 <code>.md</code> 就会出现在这里。</p>
{{/if}}
